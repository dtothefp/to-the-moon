# Alembic config. Deliberately minimal: no sqlalchemy.url here, because env.py reads
# DATABASE_URL through common.session instead. Keeping the URL out of this file means the
# same config works locally, in the dev container, and on Railway with nothing templated.
#
# Paths use %(here)s (the directory holding this file), so the config resolves the same
# whether alembic is invoked from packages/core via a moon task or from the repo root by
# Railway's preDeployCommand. A cwd-relative script_location breaks the second case.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
# UTC timestamps in revision filenames, so `ls versions/` sorts chronologically and two
# people generating revisions on the same day do not collide on a bare slug.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
